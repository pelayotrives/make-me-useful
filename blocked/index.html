<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked</title>
    <style>
      :root {
        --ink: #1e1e24;
        --signal: #92140c;
        --paper: #fff8f0;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", "Fira Code", "Menlo", "Consolas", monospace;
      }

      main {
        width: min(520px, 100%);
        padding: 28px;
        border: 1px solid rgba(146, 20, 12, 0.36);
        border-radius: 24px;
        background: #fffdf9;
      }

      h1, p { margin: 0; }
      h1 { font-size: 28px; line-height: 1; }
      p { margin-top: 10px; line-height: 1.45; }
      .eyebrow { margin-bottom: 8px; color: var(--signal); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Focus lock</p>
      <h1>This domain is blocked during the current study block.</h1>
      <p>Finish the active block or hit your test reset in the extension if you are debugging the flow.</p>
    </main>
  </body>
</html>
